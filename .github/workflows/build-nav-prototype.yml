name: Build TRX APEX Navigation Lab
on:
  push:
    branches: [prototype/v0.1-native-3d]
    paths: ['prototype-nav/**', '.github/workflows/build-nav-prototype.yml']
  workflow_dispatch:
concurrency:
  group: nav-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEYSTORE_PATH: ${{ github.workspace }}/prototype-nav/lab.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Generate original demo geometry
        run: python3 prototype-nav/tools/generate_scene.py
      - name: Prepare permanent signing key
        run: |
          test -n "$MAPS_API_KEY"
          test -n "$APEX_KEYSTORE_BASE64"
          test -n "$APEX_KEYSTORE_PASSWORD"
          printf '%s' "$APEX_KEYSTORE_BASE64" | base64 --decode > "$APEX_KEYSTORE_PATH"
      - name: Build native prototype and instrumentation
        run: gradle -p prototype-nav assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Verify signing certificate and compatibility
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs prototype-nav/app/build/outputs/apk/debug/app-debug.apk | grep -Fi 'Signer #1 certificate SHA-1 digest: 0304af48b67072be313f17c2d8f7176d6c78d3bc'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging prototype-nav/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render and exercise prototype
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash prototype-nav/tools/emulator_check.sh
      - name: Save runtime results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRX-APEX-3D-Lab-v0.3.1-runtime-QA
          path: |
            prototype-nav/qa/
            prototype-nav/app/build/reports/androidTests/
            prototype-nav/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Upload verified prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: TRX-APEX-3D-Lab-v0.3.1-SIGNED-APK
          path: prototype-nav/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
