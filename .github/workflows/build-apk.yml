name: Build Android APK

on:
  push:
    branches: [main, trx-apex-v5]
  workflow_dispatch:

concurrency:
  group: trx-apex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Create native Android project
        run: npx cap add android

      - name: Install TRX APEX native integrations
        run: |
          cp native/android/app-build.gradle android/app/build.gradle
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/diaztradeinc/trxlauncher
          cp native/android/java/*.java android/app/src/main/java/com/diaztradeinc/trxlauncher/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRX-APEX-v5.1-FINAL-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
