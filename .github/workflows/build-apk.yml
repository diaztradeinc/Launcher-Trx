name: Build Android APK

on:
  push:
    branches: [main, trx-apex-v5]
  workflow_dispatch:

concurrency:
  group: trx-apex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/trx-apex-release.jks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Create native Android project
        run: |
          # The repository keeps generated Android files for inspection, while
          # native/android is the authoritative build template. Recreate the
          # generated platform on every CI run to avoid stale Capacitor state.
          rm -rf android
          npx cap add android

      - name: Install TRX APEX native integrations
        run: |
          sed -i 's/com.android.tools.build:gradle:8.13.0/com.android.tools.build:gradle:8.13.2/' android/build.gradle
          cp native/android/app-build.gradle android/app/build.gradle
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R native/android/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/java/com/diaztradeinc/trxlauncher
          cp native/android/java/*.java android/app/src/main/java/com/diaztradeinc/trxlauncher/
          if [ -n "$APEX_KEYSTORE_BASE64" ]; then
            printf '%s' "$APEX_KEYSTORE_BASE64" | base64 --decode > "$APEX_KEYSTORE_PATH"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify permanent signing fingerprint
        if: ${{ env.APEX_KEYSTORE_BASE64 != '' }}
        run: keytool -list -v -keystore "$APEX_KEYSTORE_PATH" -storepass "$APEX_KEYSTORE_PASSWORD" -alias trxapex | grep 'SHA1:'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRX-APEX-v5.14-COMMAND-DECK-NAV-OBD-SIGNED-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
